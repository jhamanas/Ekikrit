name: Ekikrit CI Quality Gate & Release Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    # Installs the Android SDK and accepts its licences so AGP can auto-download
    # the compileSdk platform (36.1) if it is missing.
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Set up Gradle (caching)
      uses: gradle/actions/setup-gradle@v4

    # The project pins Gradle 9.3.1 in gradle/wrapper/gradle-wrapper.properties.
    # Always build through the wrapper; the runner's preinstalled `gradle` is a different version.
    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Generate debug keystore
      run: |
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Show Gradle / JDK versions
      run: ./gradlew --version

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --stacktrace

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace

    # Signed with the generated debug keystore unless real signing secrets are provided.
    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          **/build/reports/tests/
          **/build/test-results/
        if-no-files-found: ignore

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "**/build/outputs/apk/release/*.apk"
